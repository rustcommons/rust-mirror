version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Version updates wait seven days; security updates bypass this cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Version updates wait seven days; security updates bypass this cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
