name: Rustup lifecycle qualification
on:
  pull_request:
    paths:
      - 'src/selection/**'
      - 'src/publish.rs'
      - 'src/lib.rs'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/prove_nexus.py'
      - 'scripts/run_nexus_proof.py'
      - 'scripts/*rustup*'
      - '.github/workflows/rustup-lifecycle.yml'
  workflow_dispatch:
concurrency:
  group: rustup-lifecycle-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CLI and identify native host
        shell: bash
        run: |
          cargo build --release --locked
          rustc -vV | sed -n 's/^host: /HOST=/p' >> "$GITHUB_ENV"
      - name: Install the clean qualified package in a fresh Cargo home (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo package --locked
          CARGO_HOME="$RUNNER_TEMP/package-cargo-home" cargo install --path target/package/rust-mirror-0.2.0 --locked --root "$RUNNER_TEMP/package-install" -j 2
          cp "$RUNNER_TEMP/package-install/bin/rust-mirror" target/release/rust-mirror
          python3 - "$RUNNER_TEMP/package-qualification.json" <<'PYCODE'
          import hashlib,json,pathlib,subprocess,sys,tarfile
          archive=pathlib.Path('target/package/rust-mirror-0.2.0.crate')
          with tarfile.open(archive) as tar:
              vcs=json.load(tar.extractfile('rust-mirror-0.2.0/.cargo_vcs_info.json'))
          assert not vcs['git'].get('dirty',False)
          binary=pathlib.Path('target/release/rust-mirror')
          output=subprocess.check_output([str(binary.resolve()),'--events','jsonl','--version'],text=True)
          events=[json.loads(line) for line in output.splitlines()]
          assert events[0]['protocol']==1 and events[-1]['report']['tool_version']=='0.2.0'
          result={'vcs':vcs,'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'installed_from_clean_package':True,'fresh_cargo_home':True,'events':events}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(result,indent=2)+'\n')
          PYCODE
      - name: Validate Windows isolation policy before large downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prove_rustup_windows.ps1 -ValidateOnly -Generations "$env:RUNNER_TEMP/rustup-generations" -Evidence "$env:RUNNER_TEMP/rustup-firewall-preflight" -PublisherCli "$env:GITHUB_WORKSPACE/target/release/rust-mirror.exe"
      - name: Linux publisher and TLS preflight
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net sh -c 'ip link set lo up; exec python3 "$1/scripts/prove_rustup_lifecycle.py" --publisher-preflight --publisher-cli "$1/target/release/rust-mirror" --host "$3" --evidence "$2/publisher-preflight"' sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOST"
      - name: macOS publisher and TLS preflight
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/prove_rustup_lifecycle.py --publisher-preflight --publisher-cli "$GITHUB_WORKSPACE/target/release/rust-mirror" --host "$HOST" --evidence "$RUNNER_TEMP/publisher-preflight"
      - name: Prepare genuine old and new generations
        shell: bash
        run: python scripts/prepare_rustup_lifecycle.py --cli target/release/rust-mirror${{ runner.os == 'Windows' && '.exe' || '' }} --host "$HOST" --output "$RUNNER_TEMP/rustup-generations" ${{ runner.os == 'Linux' && '--extra-channels' || '' }}
      - name: Isolated Linux lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net sh -c 'ip link set lo up; exec python3 "$1/scripts/prove_rustup_lifecycle.py" --old "$2/rustup-generations/old/mirror" --new "$2/rustup-generations/new/mirror" --publisher-cli "$1/target/release/rust-mirror" --host "$3" --evidence "$2/rustup-lifecycle" --require-default-profile' sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOST"
      - name: Sandboxed macOS lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/prove_rustup_lifecycle.py --old "$RUNNER_TEMP/rustup-generations/old/mirror" --new "$RUNNER_TEMP/rustup-generations/new/mirror" --publisher-cli "$GITHUB_WORKSPACE/target/release/rust-mirror" --host "$HOST" --evidence "$RUNNER_TEMP/rustup-lifecycle" --require-default-profile
      - name: Firewall-isolated Windows lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prove_rustup_windows.ps1 -Generations "$env:RUNNER_TEMP/rustup-generations" -Evidence "$env:RUNNER_TEMP/rustup-lifecycle" -HostTriple "$env:HOST" -PublisherCli "$env:GITHUB_WORKSPACE/target/release/rust-mirror.exe"
      - name: Actual isolated Nexus Raw lifecycle and selected-schema proof
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=sonatype/nexus3@sha256:390b8ec7e712c680ed8b449b766695a7c5ebbf41e489317618e63ca199f2cc09
          docker pull "$image"
          sudo python3 scripts/run_nexus_proof.py --runtime docker --image "$image" --publisher-cli "$GITHUB_WORKSPACE/target/release/rust-mirror" --snapshot "$RUNNER_TEMP/rustup-generations/old/mirror" --next-snapshot "$RUNNER_TEMP/rustup-generations/new/mirror" --evidence "$RUNNER_TEMP/rustup-nexus-collection" --allow-raw-mime-types
          sudo python3 scripts/run_nexus_proof.py --runtime docker --image "$image" --publisher-cli "$GITHUB_WORKSPACE/target/release/rust-mirror" --snapshot "$RUNNER_TEMP/rustup-generations/new-raw/.sync/snapshots/0/mirror" --evidence "$RUNNER_TEMP/rustup-nexus-selection" --allow-raw-mime-types
      - name: Collect bounded Nexus diagnostics without private homes or keys
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-diagnostics"
          sudo python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib,shutil,sys
          root=pathlib.Path(sys.argv[1])
          for label in ('collection','selection'):
              source=root/('rustup-nexus-'+label)
              dest=root/'nexus-diagnostics'/label
              dest.mkdir(exist_ok=True)
              for directory in (source,source/'proof',source/'proof/lifecycle'):
                  if not directory.exists(): continue
                  for item in directory.iterdir():
                      if item.is_file() and item.suffix in ('.json','.stdout','.stderr') and not item.name.startswith('nexus.'):
                          shutil.copyfile(item,dest/(directory.name+'-'+item.name))
          PY
      - name: Save bounded proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustup-lifecycle-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/package-qualification.json
            ${{ runner.temp }}/rustup-generations/*.toml
            ${{ runner.temp }}/rustup-generations/*.json
            ${{ runner.temp }}/rustup-generations/*.stdout
            ${{ runner.temp }}/rustup-generations/*.stderr
            ${{ runner.temp }}/rustup-generations/*/mirror/snapshot.toml
            ${{ runner.temp }}/rustup-lifecycle/*.json
            ${{ runner.temp }}/rustup-lifecycle/*.stdout
            ${{ runner.temp }}/rustup-lifecycle/*.stderr
            ${{ runner.temp }}/rustup-lifecycle-firewall.json
            ${{ runner.temp }}/publisher-preflight/*.json
            ${{ runner.temp }}/publisher-preflight/*.stdout
            ${{ runner.temp }}/publisher-preflight/*.stderr
            ${{ runner.temp }}/rustup-firewall-preflight/*.json
            ${{ runner.temp }}/rustup-firewall-preflight/*.stdout
            ${{ runner.temp }}/rustup-firewall-preflight/*.stderr
            ${{ runner.temp }}/nexus-diagnostics/**/*.json
            ${{ runner.temp }}/nexus-diagnostics/**/*.stdout
            ${{ runner.temp }}/nexus-diagnostics/**/*.stderr
