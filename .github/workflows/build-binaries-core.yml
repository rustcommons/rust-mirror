name: Build binary payloads
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      candidate:
        type: boolean
        default: false
      attest:
        type: boolean
        default: false
      artifact-prefix:
        type: string
        default: ''
    outputs:
      artifact-name:
        value: ${{ jobs.verify.outputs.artifact-name }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate frozen source and signing boundary
        env:
          CONTEXT_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE: ${{ inputs.candidate }}
          ATTEST: ${{ inputs.attest }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          python - <<'PYTHON'
          import os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import release_binaries as release
          assert os.environ['GITHUB_REPOSITORY']=='rustcommons/rust-mirror', 'foreign callers are not supported'
          commit=os.environ['SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)
          assert commit==os.environ['CONTEXT_COMMIT'], 'Build source must equal the invoking PR/branch/tag SHA; dispatch historical source at its immutable tag'
          assert re.fullmatch(r'(?:[a-z][a-z0-9-]{0,20})?',os.environ['ARTIFACT_PREFIX'])
          candidate=os.environ['CANDIDATE']=='true'
          record=release.record(Path('.'),os.environ['RELEASE_TAG'],commit if candidate else None)
          assert record['commit']==commit
          if os.environ['ATTEST']=='true':
              event=__import__('json').load(open(os.environ['GITHUB_EVENT_PATH']))
              allowed=(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_REF']=='refs/tags/'+record['tag']) or (os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_REF'] in ('refs/heads/main','refs/tags/'+record['tag']) and str(event['inputs'].get('dry_run')).lower()=='false')
              assert allowed and not candidate
              assert release.remote_commit(Path('.'),record['tag'])==commit
              subprocess.run(['git','merge-base','--is-ancestor',commit,'origin/main'],check=True)
          PYTHON
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TARGET: ${{ matrix.target }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          repository: rustcommons/cargo-libc
          ref: e68ca7bf3a8ffd973c8576acc48abd0fbcc66d25
          path: cargo-libc
          persist-credentials: false
      - name: Install qualified GNU producer tools (release job only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          test "$(git -C cargo-libc rev-parse HEAD)" = e68ca7bf3a8ffd973c8576acc48abd0fbcc66d25
          command -v clang-18 gcc g++ readelf
          clang-18 --version
          gcc --version
          cargo install cargo-libc --path cargo-libc --version =0.7.0 --locked --root "$RUNNER_TEMP/cargo-libc-tools" -j 2
      - name: Install musl C compiler for existing C dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools=1.2.2-4 musl-dev=1.2.2-4 musl=1.2.2-4
      - name: Locked native build from frozen tag
        shell: bash
        working-directory: source
        run: |
          if [[ "$RELEASE_TARGET" == x86_64-unknown-linux-gnu ]]; then
            python ../automation/scripts/release_gnu.py --source . --tool "$RUNNER_TEMP/cargo-libc-tools/bin" --output "$RUNNER_TEMP/gnu-qualified" --version "${RELEASE_TAG#v}"
            exit 0
          elif [[ "$RELEASE_TARGET" == x86_64-pc-windows-msvc ]]; then
            export RUSTFLAGS='-C target-feature=+crt-static -C link-arg=/Brepro'
          elif [[ "$RELEASE_TARGET" == x86_64-unknown-linux-musl ]]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
            export CC_x86_64_unknown_linux_musl=musl-gcc
          fi
          cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Smoke both original and archived binary; record ABI and exact source
        shell: bash
        run: |
          extra=()
          if [[ "$CANDIDATE" == true ]]; then extra+=(--candidate); fi
          if [[ "$RELEASE_TARGET" == x86_64-unknown-linux-gnu ]]; then
            extra+=(--glibc-report "$RUNNER_TEMP/gnu-qualified/gnu-report.json")
          fi
          python automation/scripts/release_binaries.py package --source source --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/binary-artifact" "${extra[@]}"
      - name: Save exact GNU producer and blocking runtime-gate evidence
        if: matrix.target == 'x86_64-unknown-linux-gnu' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix }}gnu-release-qualification
          path: |
            ${{ runner.temp }}/gnu-qualified/gnu-report.json
            ${{ runner.temp }}/gnu-qualified/**/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Musl real DNS/TLS plan, approved sync and isolated Cargo client
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: python automation/scripts/prove_crates_platform.py --binary source/target/x86_64-unknown-linux-musl/release/rust-mirror --evidence "$RUNNER_TEMP/musl-network"
      - name: Musl private-CA proxy, killed transfer and cancellation/resume
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: python automation/scripts/prove_crates_resume.py --binary source/target/x86_64-unknown-linux-musl/release/rust-mirror --evidence "$RUNNER_TEMP/musl-resume"
      - name: Record musl DNS/TLS scope and resolver files
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def result(name):
              rows = [json.loads(line) for line in (root / 'musl-network' / name).read_text().splitlines()]
              assert rows[-1]['type'] == 'result' and rows[-1]['ok']
              return rows[-1]['report']
          preview = result('sync-preview.jsonl')
          completed = result('sync-approved.jsonl')
          assert preview['status'] == 'needs_approval' and completed['status'] == 'completed'
          assert preview['plan_id'] == completed['plan_id']
          private_ca = json.loads((root / 'musl-resume/resume-proof.json').read_text())
          summary = {'source': os.environ['RELEASE_COMMIT'], 'target': os.environ['RELEASE_TARGET'],
            'direct_official_dns_tls_sync': True, 'hosts': ['index.crates.io', 'static.crates.io'],
            'plan_id': completed['plan_id'], 'tls': 'rustls; verification enabled; bundled public roots',
            'resolver_files_present': {p: Path(p).is_file() for p in ['/etc/hosts', '/etc/resolv.conf']},
            'glibc_nss_plugins': False, 'private_ca_proxy_kill_cancel_resume': private_ca,
            'scope': 'Successful named official HTTPS operations, not DNS packet inspection or all NSS/proxy policies'}
          (root / 'binary-artifact/network-smoke.json').write_text(json.dumps(summary, indent=2) + '\n')
          PYTHON
      - name: Save bounded musl network evidence without private keys or Cargo homes
        if: matrix.target == 'x86_64-unknown-linux-musl' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix }}musl-network-evidence
          path: |
            ${{ runner.temp }}/musl-network/*.jsonl
            ${{ runner.temp }}/musl-network/*.stderr
            ${{ runner.temp }}/musl-network/https-client/client-proof.json
            ${{ runner.temp }}/musl-resume/resume-proof.json
            ${{ runner.temp }}/musl-resume/*.jsonl
            ${{ runner.temp }}/musl-resume/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix }}binary-${{ matrix.target }}
          path: ${{ runner.temp }}/binary-artifact
          if-no-files-found: error
          retention-days: 14
  verify:
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      CANDIDATE: ${{ inputs.candidate }}
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
      CARGO_BUILD_JOBS: '2'
      ATTEST: ${{ inputs.attest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: frozen-source
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.artifact-prefix }}binary-*
          path: binary-artifacts
      - name: Generate the exact-lockfile all-target Cargo SBOM
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          cargo install cargo-cyclonedx --version =0.5.9 --locked --root "$RUNNER_TEMP/sbom-tool" -j 2
          python scripts/release_sbom.py --source frozen-source --commit "$SOURCE_COMMIT" --tool "$RUNNER_TEMP/sbom-tool/bin/cargo-cyclonedx" --output "$RUNNER_TEMP/release.cdx.json"
      - name: Validate archives and SBOM; generate SHA256SUMS
        run: |
          extra=()
          if [[ "$CANDIDATE" == true ]]; then extra+=(--candidate); fi
          python scripts/release_binaries.py collect --root . --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --artifacts binary-artifacts --output release-assets --artifact-prefix "$ARTIFACT_PREFIX" --sbom "$RUNNER_TEMP/release.cdx.json" "${extra[@]}"
      - name: Check existing release body and live tag without writing
        if: ${{ !inputs.candidate }}
        run: |
          extra=()
          if [[ "$ATTEST" != true ]]; then extra+=(--allow-existing); fi
          python scripts/release_binaries.py preflight --root . --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --wait-seconds 600 "${extra[@]}"
      - name: Verify sorted checksum manifest
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Report verified artifact name
        id: artifact
        env:
          PREFIX: ${{ inputs.artifact-prefix }}
        run: echo "name=${PREFIX}verified-release-assets" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-prefix }}verified-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 14
