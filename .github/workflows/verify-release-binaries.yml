name: Verify published binary downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public release tag to verify without writing
        type: string
        required: true
        default: v0.6.0
  pull_request:
    paths:
      - '.github/workflows/verify-release-binaries.yml'
      - 'scripts/verify_release_binaries.py'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  attestations: read
jobs:
  download-and-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download public assets, verify all hashes/attestations and run native binary
        if: matrix.target != 'x86_64-unknown-linux-gnu' || (inputs.tag || 'v0.6.0') != 'v0.5.1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.6.0' }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/verify_release_binaries.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/live-binary-verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-download-proof-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/live-binary-verification/*.json
          if-no-files-found: warn
          retention-days: 14
