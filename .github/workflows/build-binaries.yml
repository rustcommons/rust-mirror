name: Build and attest release binaries
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries-core.yml # zizmor: ignore[self-repository] ./ is same-commit and supported by pinned actionlint 1.7.12; $/ is not yet supported there.
    with:
      tag: ${{ inputs.tag }}
      commit: ${{ inputs.commit }}
      candidate: false
      attest: true
  attest:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-assets
      - name: Attest archives, SBOM and manifest inside the isolated reusable workflow
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Keep the signed provenance bundle for the release-asset uploader
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -f "$BUNDLE" && test ! -L "$BUNDLE"
          mkdir "$RUNNER_TEMP/release-provenance"
          cp "$BUNDLE" "$RUNNER_TEMP/release-provenance/attestation.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-provenance
          path: ${{ runner.temp }}/release-provenance/attestation.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Resolve the single SBOM path
        id: sbom
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-assets/*.cdx.json)
          test "${#files[@]}" -eq 1
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Bind the Cargo dependency SBOM to each archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.tar.gz
          sbom-path: ${{ steps.sbom.outputs.path }}
