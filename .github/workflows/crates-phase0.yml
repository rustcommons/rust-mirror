name: Crate resolution Phase 0
on:
  pull_request:
    paths:
      - 'src/crates/**'
      - 'tests/crates_phase0.rs'
      - 'examples/crates_phase0.rs'
      - 'scripts/*crates_phase0*'
      - 'scripts/check_crates_collisions.py'
      - 'tests/fixtures/ndk-sys-20261114.index'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crates-phase0.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  cargo-conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build native research driver and run focused fixtures
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo test --locked --test crates_phase0
          cargo build --locked --example crates_phase0
      - name: Real Cargo oracle against filtered sparse registries
        run: python scripts/check_crates_phase0.py --driver target/debug/examples/crates_phase0 --work "$RUNNER_TEMP/crates-phase0"
      - name: Historical collisions and real windowing roots against Cargo 1.90
        run: python scripts/check_crates_collisions.py --driver target/debug/examples/crates_phase0 --work "${{ runner.temp }}/crates-collisions"
      - name: Save exact metadata, plans, locks, logs and overfetch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crates-phase0-evidence
          path: |
            ${{ runner.temp }}/crates-phase0
            ${{ runner.temp }}/crates-collisions/*/summary.json
            ${{ runner.temp }}/crates-collisions/*/plan.json
            ${{ runner.temp }}/crates-collisions/*/*.log
            ${{ runner.temp }}/crates-collisions/summary.json
          if-no-files-found: warn
