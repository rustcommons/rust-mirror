name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify packaged documentation and source
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
        run: cargo package --locked
      - name: Save verified Rust 1.90 package
        if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-mirror-package
          path: target/package/rust-mirror-*.crate
          if-no-files-found: error
      - name: Install verified package with a fresh Cargo home
        if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          python3 - <<'PYTHON'
          import os,pathlib,tarfile,tomllib
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          with tarfile.open(f'target/package/rust-mirror-{version}.crate') as archive:
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-source', filter='data')
          PYTHON
          candidate_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          CARGO_HOME="$RUNNER_TEMP/candidate-cargo" cargo install rust-mirror --path "$RUNNER_TEMP/candidate-source/rust-mirror-$candidate_version" --version "=$candidate_version" --locked --root "$RUNNER_TEMP/candidate-install" -j 2
          "$RUNNER_TEMP/candidate-install/bin/rust-mirror" --events jsonl --version > "$RUNNER_TEMP/candidate-version.jsonl"
      - name: Installed publisher in a loopback-only namespace
        if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          trap 'sudo rm -f -- "$RUNNER_TEMP/candidate-publisher/ca.key" "$RUNNER_TEMP/candidate-publisher/server.key"' EXIT
          sudo unshare --net sh -c 'ip link set lo up; exec python3 "$1/scripts/prove_rustup_lifecycle.py" --publisher-preflight --publisher-cli "$2/candidate-install/bin/rust-mirror" --host x86_64-unknown-linux-gnu --evidence "$2/candidate-publisher"' sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Verify fixture key cleanup
        if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          proof=root/'candidate-publisher'
          assert not (proof/'ca.key').exists() and not (proof/'server.key').exists()
          (root/'candidate-cleanup.json').write_text(json.dumps({'private_keys_destroyed': True, 'fixture_created': proof.exists()})+'\n')
          PYTHON
      - name: Save installed package proof
        if: (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-installed-publisher
          path: |
            ${{ runner.temp }}/candidate-version.jsonl
            ${{ runner.temp }}/candidate-cleanup.json
            ${{ runner.temp }}/candidate-publisher/*.json
            ${{ runner.temp }}/candidate-publisher/*.stdout
            ${{ runner.temp }}/candidate-publisher/*.stderr
          if-no-files-found: error
      - run: python -m unittest discover -s tests -p "test_*.py"
