name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify packaged documentation and source
        run: cargo package --locked
      - name: Save verified Rust 1.90 package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-mirror-package
          path: target/package/rust-mirror-*.crate
          if-no-files-found: error
      - name: Install verified package with a fresh Cargo home
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          python3 - <<'PYTHON'
          import os,pathlib,tarfile,tomllib
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          with tarfile.open(f'target/package/rust-mirror-{version}.crate') as archive:
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-source', filter='data')
          PYTHON
          candidate_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          CARGO_HOME="$RUNNER_TEMP/candidate-cargo" cargo install --path "$RUNNER_TEMP/candidate-source/rust-mirror-$candidate_version" --locked --root "$RUNNER_TEMP/candidate-install" -j 2
          "$RUNNER_TEMP/candidate-install/bin/rust-mirror" --events jsonl --version > "$RUNNER_TEMP/candidate-version.jsonl"
      - name: Installed publisher in a loopback-only namespace
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          trap 'sudo rm -f -- "$RUNNER_TEMP/candidate-publisher/ca.key" "$RUNNER_TEMP/candidate-publisher/server.key"' EXIT
          sudo unshare --net sh -c 'ip link set lo up; exec python3 "$1/scripts/prove_rustup_lifecycle.py" --publisher-preflight --publisher-cli "$2/candidate-install/bin/rust-mirror" --host x86_64-unknown-linux-gnu --evidence "$2/candidate-publisher"' sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Verify fixture key cleanup
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          proof=root/'candidate-publisher'
          assert not (proof/'ca.key').exists() and not (proof/'server.key').exists()
          (root/'candidate-cleanup.json').write_text(json.dumps({'private_keys_destroyed': True, 'fixture_created': proof.exists()})+'\n')
          PYTHON
      - name: Save installed package proof
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-installed-publisher
          path: |
            ${{ runner.temp }}/candidate-version.jsonl
            ${{ runner.temp }}/candidate-cleanup.json
            ${{ runner.temp }}/candidate-publisher/*.json
            ${{ runner.temp }}/candidate-publisher/*.stdout
            ${{ runner.temp }}/candidate-publisher/*.stderr
          if-no-files-found: error
      - run: python -m unittest discover -s tests -p "test_*.py"
