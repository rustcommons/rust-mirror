name: Offline toolchain proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - run: target/debug/rust-mirror fetch-toolchain --release 1.90.0 --host x86_64-unknown-linux-gnu --rustup-version 1.28.2 --output "$RUNNER_TEMP/snapshot"
      - run: sudo unshare --net python3 scripts/prove_offline.py --snapshot "$RUNNER_TEMP/snapshot/mirror" --evidence "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-proof-logs
          path: |
            ${{ runner.temp }}/proof/*.json
            ${{ runner.temp }}/proof/*.stdout
            ${{ runner.temp }}/proof/*.stderr
            ${{ runner.temp }}/snapshot/mirror/snapshot.toml
