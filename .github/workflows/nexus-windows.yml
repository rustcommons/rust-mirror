name: Native Windows Nexus qualification
on:
  pull_request:
    paths:
      - 'scripts/run_nexus_windows.py'
      - 'scripts/prove_nexus_windows_crates.py'
      - 'scripts/prove_nexus.py'
      - 'scripts/prove_crates_https.py'
      - 'scripts/prove_lock_import.py'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nexus-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-nexus:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual CLI
        run: cargo build --locked --jobs 2
      - name: Native OSS crate and Windows Cargo qualification plus one Rustup install
        run: python scripts/run_nexus_windows.py --binary target/debug/rust-mirror.exe --with-toolchain --root "${{ runner.temp }}/rust-mirror-owned-nexus" --evidence "${{ runner.temp }}/windows-nexus-evidence"
      - name: Teardown only owned instance after interruption
        if: always()
        run: python scripts/run_nexus_windows.py --cleanup --root "${{ runner.temp }}/rust-mirror-owned-nexus"
      - name: Save allowlisted proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-nexus
          path: |
            ${{ runner.temp }}/windows-nexus-evidence/summary.json
            ${{ runner.temp }}/windows-nexus-evidence/cleanup.json
            ${{ runner.temp }}/windows-nexus-evidence/requests.json
            ${{ runner.temp }}/windows-nexus-evidence/native-trust-*.json
            ${{ runner.temp }}/windows-nexus-evidence/*.jsonl
            ${{ runner.temp }}/windows-nexus-evidence/*.stdout
            ${{ runner.temp }}/windows-nexus-evidence/*.stderr
          if-no-files-found: warn
