name: Reproducible binary measurements
on:
  pull_request:
    paths:
      - '.github/workflows/build-binaries.yml'
      - '.github/workflows/build-binaries-core.yml'
      - '.github/workflows/reproducible-builds.yml'
      - 'scripts/release*.py'
      - 'scripts/compare_reproducible.py'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.freeze.outputs.commit }}
      tag: ${{ steps.freeze.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: freeze
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['package']['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('tag=v'+version+'\n')
          PY
  first:
    needs: source
    uses: ./.github/workflows/build-binaries-core.yml # zizmor: ignore[self-repository] ./ also binds the caller commit; pinned actionlint 1.7.12 does not support $/ yet.
    with:
      tag: ${{ needs.source.outputs.tag }}
      commit: ${{ needs.source.outputs.commit }}
      candidate: true
      attest: false
      artifact-prefix: a-
  second:
    needs: source
    uses: ./.github/workflows/build-binaries-core.yml # zizmor: ignore[self-repository] ./ also binds the caller commit; pinned actionlint 1.7.12 does not support $/ yet.
    with:
      tag: ${{ needs.source.outputs.tag }}
      commit: ${{ needs.source.outputs.commit }}
      candidate: true
      attest: false
      artifact-prefix: b-
  compare:
    needs: [source, first, second]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.first.outputs.artifact-name }}
          path: first
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.second.outputs.artifact-name }}
          path: second
      - name: Compare real bytes and record metadata causes or unresolved differences
        env:
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          python scripts/compare_reproducible.py --first first --second second --version "${TAG#v}" --output results
          cat results/reproducibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reproducibility-results
          path: results
          if-no-files-found: error
          retention-days: 30
