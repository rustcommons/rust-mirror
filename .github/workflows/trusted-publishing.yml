# Rust Commons standard release pipeline (phase 2: crate and binaries); see
# https://github.com/rustcommons/.github/blob/main/docs/TRUSTED-PUBLISHING.md
# crates.io binds Trusted Publishing to this file name and the `crates-io`
# environment; never rename either. In this binary repository `build` calls the
# isolated reusable builder/signer build-binaries.yml, which builds the crate and
# five binaries (all qualification gates) and signs them as Build / Checksums and
# attestations, all before the owner's approval. There is no top-level `attest`.
name: Trusted publishing
on:
  push:
    tags: ['v*']
  # Dry runs: gate and the full build only, never sign or publish.
  pull_request:
    paths:
      - '.github/workflows/trusted-publishing.yml'
      - '.github/workflows/build-binaries.yml'
      - '.github/workflows/build-binaries-core.yml'
      - 'scripts/release-gate.py'
      - 'scripts/check-release-docs.py'
      - 'scripts/release_binaries.py'
      - 'scripts/release_openpgp.py'
      - '.github/release-signing-key.asc'
      - 'tests/test_release_openpgp.py'
      - 'scripts/release_sbom.py'
      - 'scripts/release_gnu.py'
      - 'scripts/glibc_measure.py'
      - 'scripts/prove_crates_platform.py'
      - 'scripts/prove_crates_resume.py'
      - 'scripts/verify_registry_release.py'
      - 'scripts/verify_release_binaries.py'
      - 'tests/test_release_binaries.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'docs/releases/**'
  workflow_dispatch:
permissions:
  contents: read
# A tag run is never cancelled; only newer pushes to the same PR supersede.
concurrency:
  group: trusted-publishing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Release gate
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads CI results for the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      crates: ${{ steps.gate.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Decide whether this run may publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-gate.py --event "$EVENT" --ref-name "$REF_NAME" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Require a qualified weekly corpus or full dispatch on the release commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/corpus.py release-check --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
      - name: Require the immutable reviewed main source and one expected crate
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then git merge-base --is-ancestor HEAD origin/main; fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import release_binaries
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = 'v' + os.environ['VERSION']
          # Tag runs bind the tag; dry runs bind the checked-out commit as a candidate.
          record = release_binaries.record(Path('.'), tag, None if os.environ['EVENT'] == 'push' else head)
          assert record['commit'] == head, 'tag does not point to the checked-out commit'
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'], text=True))
          assert len(metadata['workspace_members']) == 1 and [p['name'] for p in metadata['packages']] == ['rust-mirror'], 'expected exactly the rust-mirror crate'
          print(f'Source {head} and the single rust-mirror crate match {tag}.')
          PY
      - name: Test the pinned public key and signing/verification with throwaway keys
        run: python3 -m unittest discover -s tests -p test_release_openpgp.py

  build:
    name: Build
    needs: gate
    # A fork PR cannot be granted id-token: write, which the reusable call requests,
    # so it would be rejected at startup; fork PRs skip the dry-run build. Same-repo
    # PRs, dispatches and tags always run it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The nested "Checksums and attestations" job signs only on a v* tag push and is
    # the only job that uses these two grants; every build job holds contents read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # build-binaries.yml builds the crate and all five binaries through the read-only
    # core (every qualification gate, one SBOM, one SHA256SUMS) and, on a tag, signs
    # them in its own job: Build / Checksums and attestations. Dry runs build a
    # candidate of the checked-out commit and never sign.
    uses: ./.github/workflows/build-binaries.yml # zizmor: ignore[self-repository] ./ also binds the caller commit; pinned actionlint 1.7.12 does not support $/ yet.
    with:
      tag: v${{ needs.gate.outputs.version }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate: ${{ github.event_name != 'push' }}
      sign: ${{ needs.gate.outputs.publish == 'true' }}

  publish:
    name: Publish to crates.io
    # `gate` is listed so the condition can read its output.
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true' && github.repository == 'rustcommons/rust-mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The owner's approval click. Build provenance is ready; OpenPGP signing
    # uses this environment's secrets only after approval, before publishing.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      CRATES: ${{ needs.gate.outputs.crates }}
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/dist
      - name: Re-check SHA256SUMS
        run: cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS
      # An existing publication must already equal the exact tag payload; then no
      # token is minted.
      - name: Recheck after owner approval; refuse a concurrent publication
        id: registry
        run: python3 scripts/verify_registry_release.py --tag "$RELEASE_TAG" --allow-missing --github-output "$GITHUB_OUTPUT"
      # Nothing compiles in this job: it holds id-token: write and the crates-io
      # environment, so no crate or dependency code (build scripts, proc macros) may
      # run here. --no-verify packages without building; the build job already built
      # the packaged source, and `cmp` checks the bytes against the attested file.
      - name: Package and compare release crates (no build, no token)
        id: pending
        if: steps.registry.outputs.published == 'false'
        run: |
          set -euo pipefail
          pending=()
          for crate in $(jq -r '.[]' <<<"$CRATES"); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'rustcommons-release' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already on crates.io; skipping."
              continue
            fi
            # Publish only bytes identical to the checksummed, attested file.
            cargo package --locked --no-verify -p "$crate"
            cmp "target/package/$crate-$VERSION.crate" "$RUNNER_TEMP/dist/$crate-$VERSION.crate"
            pending+=("$crate")
          done
          echo "crates=${pending[*]}" >> "$GITHUB_OUTPUT"
      # Preserve the first signature's bytes on retries: detached signatures include
      # their creation time, while GitHub release assets must never be replaced.
      - name: Recover this run's prior signature artifact, if present
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-openpgp-signature
          path: ${{ runner.temp }}/prior-signature
      - name: Sign SHA256SUMS and verify against the pinned public key
        id: openpgp
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          sign_home=''
          verify_home=''
          cleanup() {
            for home in "$sign_home" "$verify_home"; do
              if [ -n "$home" ]; then
                gpgconf --homedir "$home" --kill gpg-agent || true
                rm -rf -- "$home"
              fi
            done
          }
          trap cleanup EXIT
          sign_home=$(mktemp -d)
          verify_home=$(mktemp -d)
          chmod 700 "$sign_home" "$verify_home"
          python3 scripts/release_openpgp.py sign --manifest "$RUNNER_TEMP/dist/SHA256SUMS" \
            --sign-home "$sign_home" --verify-home "$verify_home" \
            --previous "$RUNNER_TEMP/prior-signature/SHA256SUMS.asc" --github-output "$GITHUB_OUTPUT"
      - name: Save the verified signature before minting a publishing token
        if: steps.openpgp.outputs.reused != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-openpgp-signature
          path: ${{ runner.temp }}/dist/SHA256SUMS.asc
          if-no-files-found: error
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.registry.outputs.published == 'false' && steps.pending.outputs.crates != ''
        id: auth
      # Only this step sees the token; --no-verify, so nothing is compiled.
      - name: Publish release crates in dependency order
        if: steps.registry.outputs.published == 'false' && steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.pending.outputs.crates }}
        run: |
          set -euo pipefail
          for crate in $PENDING; do
            cargo publish --locked --no-verify -p "$crate"
          done

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Artifact names from build-binaries-core.yml and build-binaries.yml in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: ${{ runner.temp }}/provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-openpgp-signature
          path: ${{ runner.temp }}/dist
      - name: Stage the exact asset set (bundle subjects equal the signed files)
        run: |
          python3 scripts/release_binaries.py stage --root . --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/dist" --provenance "$RUNNER_TEMP/provenance/rust-mirror-$VERSION.intoto.jsonl"
      # Before any upload: the bundle equals GitHub's stored attestations and every
      # archive and the crate carry this SBOM. Then a draft is created (or a draft left
      # by a killed run is resumed) only if its tag, title, body and state are exactly
      # ours; missing assets are uploaded, all are checked, and only then it is
      # published. Existing assets are never replaced.
      - name: Create the draft release from the committed notes, add only missing assets, publish
        run: python3 scripts/release_binaries.py release --root . --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --assets "$RUNNER_TEMP/dist"

  verify:
    name: Verify publication
    needs: [gate, github-release]
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Every asset's digest, SHA256SUMS, provenance (signer build-binaries.yml at the
      # tag commit), the bundle against GitHub's store and the SBOM binding, then the
      # downloaded binary runs natively.
      - name: Download, verify every asset and attestation, run the public binary
        shell: bash
        run: python scripts/verify_release_binaries.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-proof-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/verification/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Live release body equals the committed notes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published-tag "v$VERSION"
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - name: crates.io checksum equals the attested crate; exact tag payload
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          python3 scripts/verify_registry_release.py --tag "$RELEASE_TAG" --wait-seconds 180
          expected=$(sha256sum "$RUNNER_TEMP/verification/downloads/rust-mirror-$VERSION.crate" | cut -d' ' -f1)
          actual=$(curl -s -A 'rustcommons-release' "https://crates.io/api/v1/crates/rust-mirror/$VERSION" | jq -r '.version.checksum')
          test "$expected" = "$actual"
          echo "crates.io checksum $actual equals the attested crate."
      - name: docs.rs build (pending is reported as pending)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          url="https://docs.rs/crate/rust-mirror/$VERSION/status.json"
          for attempt in $(seq 1 40); do
            body=$(curl -s -A 'rustcommons-release' -w '\n%{http_code}' "$url")
            code=$(tail -n1 <<<"$body")
            if [ "$code" = 200 ]; then
              status=$(head -n -1 <<<"$body" | jq -r '.doc_status')
              if [ "$status" = true ]; then echo "docs.rs built rust-mirror $VERSION."; exit 0; fi
              if [ "$status" = false ]; then echo "::error::docs.rs build failed for rust-mirror $VERSION"; exit 1; fi
            fi
            sleep 30
          done
          echo "::warning::docs.rs build for rust-mirror $VERSION is still pending after 20 minutes; not a pass."
          echo "docs.rs: PENDING" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean locked install from crates.io
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/published-cargo-home"
          root="$RUNNER_TEMP/published-install"
          cargo install rust-mirror --version "=$VERSION" --locked --root "$root"
          test "$("$root/bin/rust-mirror" --version)" = "rust-mirror $VERSION"
          # Read from a file: piping into `head` would break rust-mirror's later writes.
          "$root/bin/rust-mirror" --events jsonl --version > "$RUNNER_TEMP/version.jsonl"
          head -n1 "$RUNNER_TEMP/version.jsonl" | jq -e --arg v "$VERSION" '.type == "hello" and .protocol == 1 and .tool_version == $v'
