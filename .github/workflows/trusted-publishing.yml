name: Trusted crates.io publishing
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      published: ${{ steps.registry.outputs.published }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the immutable reviewed main source and one expected crate
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import json,subprocess,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import release_binaries
          record=release_binaries.record(Path('.'),os.environ['RELEASE_TAG'])
          assert record['commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          metadata=json.loads(subprocess.check_output(['cargo','metadata','--locked','--no-deps','--format-version','1'],text=True))
          assert len(metadata['workspace_members'])==1 and [p['name'] for p in metadata['packages']]==['rust-mirror']
          PY
      - name: Verify an already published manual release without minting a token
        id: registry
        run: python scripts/verify_registry_release.py --tag "$RELEASE_TAG" --allow-missing --github-output "$GITHUB_OUTPUT"
      - name: Qualify the new package without publishing
        if: steps.registry.outputs.published == 'false'
        run: cargo package --locked
  publish:
    needs: qualify
    if: needs.qualify.outputs.published == 'false' && github.repository == 'rustcommons/rust-mirror'
    environment: crates-io
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Recheck after owner approval; refuse a concurrent publication
        id: registry
        run: python scripts/verify_registry_release.py --tag "$RELEASE_TAG" --allow-missing --github-output "$GITHUB_OUTPUT"
      - name: Obtain a short-lived owner-approved crates.io token
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the single crate in workspace order
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package rust-mirror
      - name: Verify official archive checksum, clean VCS and exact tag payload
        run: python scripts/verify_registry_release.py --tag "$RELEASE_TAG" --wait-seconds 180
