name: CI-only glibc compatibility measurements
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/glibc-experiments.yml'
      - 'scripts/glibc_measure.py'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  measure:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_LIBC_COMMIT: e68ca7bf3a8ffd973c8576acc48abd0fbcc66d25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 112ef7a7a71d40349c601f299f965199b5b279ba # v0.5.1 source
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rustcommons/cargo-libc
          ref: e68ca7bf3a8ffd973c8576acc48abd0fbcc66d25
          path: cargo-libc
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CI compiler/provider tools (no product dependencies)
        run: |
          command -v clang-18 gcc g++ readelf
          clang-18 --version
          gcc --version
      - name: Install exact first-party cargo-libc revision and sibling helpers
        run: cargo install cargo-libc --path cargo-libc --version =0.7.0 --locked --root "$RUNNER_TEMP/cargo-libc-tools" -j 2
      - name: Build and qualify ordinary Alma8 baseline
        run: python automation/scripts/glibc_measure.py baseline --source source --output "$RUNNER_TEMP/baseline"
      - name: Measure 2.28, 2.17 and first unsupported lower boundary across old userlands
        run: python automation/scripts/glibc_measure.py experiments --source source --baseline source/target/x86_64-unknown-linux-gnu/release/rust-mirror --tool "$RUNNER_TEMP/cargo-libc-tools/bin" --tool-commit "$CARGO_LIBC_COMMIT" --output "$RUNNER_TEMP/measurements"
      - name: Save results and logs, never release assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-only-glibc-measurements
          path: |
            ${{ runner.temp }}/baseline/*.json
            ${{ runner.temp }}/baseline/*.log
            ${{ runner.temp }}/measurements/results.json
            ${{ runner.temp }}/measurements/**/*.log
          if-no-files-found: warn
          retention-days: 30
