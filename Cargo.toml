[package]
name = "rust-mirror"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Prepare pinned Rust toolchain snapshots for offline static hosting"
repository = "https://github.com/rustcommons/rust-mirror"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
semver = "1.0"
serde_json = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.9", features = ["tls"] }
tempfile = "3.10"
webpki-roots = "0.26"
x509-parser = { version = "0.18", default-features = false }
